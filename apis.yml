- aid: rubygems:webhooks-api
  name: RubyGems Webhooks API
  description: >-
    The RubyGems Webhooks API enables webhook subscriptions that fire when gems are pushed to RubyGems.org.
    Webhooks can be scoped to a specific gem or applied globally using a wildcard. Includes test-fire
    functionality and HMAC signature verification.
  humanURL: https://guides.rubygems.org/rubygems-org-api/
