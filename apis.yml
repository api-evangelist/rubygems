  name: RubyGems Gems API
  description: >-
    The RubyGems Gems API (v1) provides endpoints for retrieving gem metadata, listing owned gems, submitting
    new gems, yanking gem versions, managing gem ownership, retrieving user profiles, querying gem dependencies,
    and exchanging OIDC tokens for API keys for trusted publishing workflows.
  humanURL: https://guides.rubygems.org/rubygems-org-api/
