aid: rubygems
name: RubyGems
description: >-
  RubyGems.org is the Ruby community's primary gem hosting service, providing the infrastructure for publishing,
  discovering, and installing Ruby gems. The RubyGems API enables programmatic access to gem metadata, version
  information, download statistics, search, owner management, webhooks, and the compact index used by Bundler for
  dependency resolution. RubyGems.org hosts over 160,000 gems with billions of total downloads.
